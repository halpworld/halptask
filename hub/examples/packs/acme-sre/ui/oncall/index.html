<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>On-call</title>
<!-- No inline script: the widget CSP is script-src <this pack only>. -->
<style>
  :root { color-scheme: light dark; }
  body { margin: 0; padding: 8px 10px; font: 13px/1.4 system-ui, sans-serif; background: var(--surface, transparent); color: var(--text, CanvasText); }
  h1 { font-size: 12px; margin: 0 0 6px; color: var(--text-2, GrayText); text-transform: uppercase; letter-spacing: .04em; }
  ul { list-style: none; margin: 0; padding: 0; }
  li { display: flex; gap: 8px; padding: 3px 0; border-top: 1px solid var(--border, #8884); }
  li:first-child { border-top: 0; }
  .sev { min-width: 3.2em; font-weight: 600; color: var(--accent, #b4452f); }
  .svc { color: var(--text-3, GrayText); margin-left: auto; }
  #status { color: var(--text-2, GrayText); }
</style>
<script src="oncall.js"></script>
</head>
<body>
<h1>Open incidents</h1>
<p id="status">Connecting to the Hub...</p>
<ul id="list"></ul>
</body>
</html>

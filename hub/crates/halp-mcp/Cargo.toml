[package]
name = "halp-mcp"
description = "HalpTask Hub MCP server (rmcp): tools, resources and prompts over the core, a local socket host with client tokens, and the halp-mcp stdio shim."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "halp-mcp"
path = "src/bin/halp-mcp.rs"

[dependencies]
halp-core.workspace = true
halp-domain.workspace = true
rmcp.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["sync", "rt", "rt-multi-thread", "net", "io-util", "io-std", "time", "macros"] }
tokio-util.workspace = true
directories.workspace = true

[dev-dependencies]
rmcp = { workspace = true, features = ["server", "client"] }
halp-store.workspace = true
tempfile.workspace = true
chrono.workspace = true
base64.workspace = true

[lints]
workspace = true

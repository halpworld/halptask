[package]
name = "halp-integrations"
description = "HalpTask Hub integration runtime: connectors (GitHub, MCP servers, local git, calendars, energy) that sync external objects into the core as typed items, OAuth 2.1 + PKCE, keychain tokens."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
halp-core.workspace = true
halp-domain.workspace = true
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
keyring.workspace = true
sha2.workspace = true
base64.workspace = true
hex.workspace = true
getrandom.workspace = true
zeroize.workspace = true
reqwest.workspace = true
url.workspace = true
regex.workspace = true
icalendar.workspace = true
rrule.workspace = true
chrono-tz.workspace = true
rumqttc.workspace = true
bytes.workspace = true
rustls.workspace = true
tokio-rustls.workspace = true
rustls-platform-verifier.workspace = true
tokio = { workspace = true, features = ["sync", "rt", "time", "net", "io-util", "process", "macros"] }
tokio-util = { workspace = true, features = ["rt"] }
rmcp = { workspace = true, features = ["client", "transport-async-rw", "transport-streamable-http-client-reqwest"] }

[dev-dependencies]
halp-store.workspace = true
tempfile.workspace = true
wiremock.workspace = true
tokio = { workspace = true, features = ["sync", "rt", "rt-multi-thread", "time", "net", "io-util", "process", "macros"] }
rmcp = { workspace = true, features = ["server", "client", "transport-async-rw"] }

[lints]
workspace = true

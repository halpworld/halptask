syntax = "proto3";

package halptask.v1;

option go_package = "github.com/kenth/halptask/proto/v1;storagepb";

enum TaskStatus {
  TASK_STATUS_UNSPECIFIED = 0;
  TASK_STATUS_NONE = 1;
  TASK_STATUS_TODO = 2;
  TASK_STATUS_IN_PROGRESS = 3;
  TASK_STATUS_DONE = 4;
}

message ItemProto {
  string id = 1;
  string text = 2;
  bool is_task = 3;
  TaskStatus status = 4;
  bool folded = 5;
  repeated string tags = 6;
  repeated ItemProto children = 7;

  // Sync & Decentralized Metadata
  int64 created_at = 8;
  int64 updated_at = 9;
  string node_id = 10;
  bool deleted = 11;
  uint64 version = 12;
  string note = 13;
  bool is_focused = 14;
}

message TreeProto {
  uint32 schema_version = 1;
  repeated ItemProto roots = 2;
  int64 last_modified = 3;
}
